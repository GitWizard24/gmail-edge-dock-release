name: Purge Telemetry Logs Older Than 60 Days

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Remove stale logs
        run: |
          find ./logs -type f -name "*.log" -mtime +60 -exec rm -f {} \;

      - name: Commit cleanups
        run: |
          git config user.name "LogPruner"
          git config user.email "actions@github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-purge telemetry logs older than 60 days" && git push)
